server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 25m;

    # The app uses no Next.js Server Actions; drop scanner probes before they reach Next.
    if ($http_next_action) { return 403; } # no-server-actions
    # Auth forms validate Origin against APP_ORIGIN, so serve everything on the apex host.
    if ($host = www.__DOMAIN__) { return 301 https://__DOMAIN__$request_uri; } # www-to-apex

    # News video uploads (up to 300 MB); nginx buffers the body, then hands it to Node.
    location = /api/admin/news/video {
        client_max_body_size 310m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    } # news-video-upload

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 65s;
    }
}
